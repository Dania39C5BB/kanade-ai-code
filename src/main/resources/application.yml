spring:
  application:
    name: kanade-ai-code
  servlet:
    multipart:
      # 单个文件大小上限，设置为 2MB
      max-file-size: 2MB
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kanade
    username: root
    password: your_password
    # redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600
      database: 0
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  profiles:
    active: local


server:
  port: 8123
  # 信任 Nginx/反向代理转发的头信息，使后端在 HTTP 连接下也能识别外部 HTTPS 请求，正确设置 Secure Cookie
  forward-headers-strategy: framework
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000
        # SameSite=None + Secure: 允许跨站请求携带 Cookie（部署到服务器时浏览器不会阻止 SESSION）
        # 注意：SameSite=None 必须配合 Secure，即服务器必须通过 HTTPS 访问或前面有 Nginx 终止 TLS
        same-site: none
        secure: true

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.kanade.kanadeaicode.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn


# 添加 COS 对象存储配置（需要从腾讯云获取）
cos:
  client:
    host: your_cos_host
    secretId: your_cos_secretId
    secretKey: your_cos_secretKey
    region: ap-beijing
    bucket: kanade-ai-agent-1313093521

# 部署路径
code:
  deploy-host: http://localhost

# Pexels 图片搜索配置
pexels:
  api-key: your api key
